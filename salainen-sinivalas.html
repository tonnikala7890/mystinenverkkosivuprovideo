<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#061c3a">
    <title>Sinivalas – Salainen verkkosivu</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="ocean-page">
    <main class="ocean-world">
      <div class="ocean-stars" aria-hidden="true"></div>
      <div class="ocean-moon" aria-hidden="true"></div>
      <div class="ocean-rays" aria-hidden="true"></div>
      <div class="treasure-door-wrap">
        <button class="treasure-door" data-treasure-door type="button" aria-describedby="treasure-door-progress">
          <span class="treasure-door-icon" aria-hidden="true">🚪</span>
          <span class="treasure-door-label">Aarrekammio</span>
          <span class="treasure-door-progress" id="treasure-door-progress" data-treasure-progress aria-live="polite">Koputa oveen 10 kertaa · 0/10</span>
        </button>
      </div>
      <div class="ocean-bubbles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <section class="whale-message" aria-labelledby="whale-title">
        <p class="whale-eyebrow">SALAINEN MERI · VAIN KUTSUTUILLE</p>
        <h1 id="whale-title">Sinivalas</h1>
        <p class="whale-subtitle">Aalloissa odotti jotain ihmeellistä.</p>
        <a class="button whale-secret-shop-link" data-whale-secret-shop href="sinivalaan-kauppa.html" hidden>✦ Avaa sinivalaan salainen kauppa ✦</a>
        <div class="whale-scene" role="img" aria-label="Sinivalas ui tähtien valaisemassa meressä">
          <div class="whale-halo"></div>
          <div class="whale">🐋</div>
          <span class="whale-sparkle sparkle-one" aria-hidden="true">✦</span>
          <span class="whale-sparkle sparkle-two" aria-hidden="true">✧</span>
          <span class="whale-sparkle sparkle-three" aria-hidden="true">✦</span>
        </div>
        <p class="whale-note">Löysit salaisen sinivalaan. Pidä tämä pieni ihme omana tietonasi.</p>
        <a class="button ocean-return" href="index.html">Palaa salaiselle etusivulle</a>
      </section>
      <div class="ocean-waves" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </main>
    <script src="salaisuus.js" defer></script>
  </body>
</html>
