<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#102743">
    <title>Aarrekammio – Salainen verkkosivu</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="ocean-page">
    <main class="ocean-world treasure-world">
      <div class="ocean-stars" aria-hidden="true"></div>
      <div class="treasure-glow" aria-hidden="true"></div>
      <div class="treasure-sparkles" aria-hidden="true">✦　✧　✦　✧　✦</div>
      <section class="treasure-message" aria-labelledby="treasure-title">
        <p class="whale-eyebrow">SALAINEN MERENALAINEN KAMMIO</p>
        <h1 id="treasure-title">Aarrekammio</h1>
        <p class="whale-subtitle">Kymmenen koputusta avasi oven. Katso mitä löytyi.</p>
        <p class="treasure-reward" data-treasure-reward role="status" aria-live="polite"></p>
        <div class="treasure-chest" role="img" aria-label="Kultainen aarrearkku täynnä jalokiviä">
          <span aria-hidden="true">💎</span>
          <span aria-hidden="true">🪙</span>
          <span aria-hidden="true">👑</span>
          <span aria-hidden="true">💰</span>
          <span aria-hidden="true">✨</span>
        </div>
        <p class="whale-note">Valot tanssivat aaltojen mukana ja aarrekammio odottaa uusia löytäjiä.</p>
        <a class="button ocean-return" href="salainen-sinivalas.html">Palaa sinivalaan luo</a>
      </section>
      <div class="ocean-waves" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </main>
    <script src="salaisuus.js" defer></script>
  </body>
</html>
