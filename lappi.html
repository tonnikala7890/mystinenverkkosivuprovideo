<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#381019">
    <title>Lappi – Salainen verkkosivu</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-secret-page="mystic-reindeer">
    <main class="landing">
      <section class="content-card lapland-card" aria-labelledby="page-title">
        <h1 id="page-title">Lappi – porojen koti</h1>
        <p>Lapin tuntureilla ja metsissä elää paljon poroja. Tässä pieni kurkistus porojen kotiin.</p>
        <div class="reindeer-gallery">
          <figure>
            <img src="https://paliskunnat.fi/poro/wp-content/uploads/2014/08/porot_lumisateessa_kolarissa_2009.jpg" alt="Porot kulkevat lumisateessa Lapissa">
            <figcaption>Porot lumisateessa</figcaption>
          </figure>
          <figure>
            <button class="lapland-reindeer" type="button" data-lapland-reindeer aria-label="Klikkaa poroa">
              <img src="https://paliskunnat.fi/poro/wp-content/uploads/2021/03/Poro_Rangifer_tarandus_tarandus.jpg" alt="Poro Lapin luonnossa">
            </button>
            <figcaption>Poro Lapin luonnossa</figcaption>
          </figure>
        </div>
        <p data-key-feedback class="key-feedback" aria-live="polite"></p>
        <button class="dropped-key" data-dropped-key type="button" aria-label="Lisää löytämäsi avain tavaraluetteloon" hidden>
          <span class="key-model" aria-hidden="true"><span class="key-bow"></span><span class="key-shaft"></span><span class="key-tooth"></span></span>
        </button>
        <a class="button" href="mystinen-poro.html">Takaisin mystisen poron sivulle</a>
      </section>
    </main>
    <script src="salaisuus.js" defer></script>
  </body>
</html>
